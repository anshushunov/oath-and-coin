# Gate 0 pipeline — TDD §19, items 1-5 and 7.
#
# Item 6 (save round-trip) is deliberately absent: the save format belongs to
# Milestone 3, and a stage that checks nothing is worse than a missing stage,
# because it reads as coverage.
#
# Every stage below either proves something the code cannot prove about itself
# or it does not exist. The order is cheapest-first, so a formatting slip does
# not wait behind a full test run to be reported.
name: build

on:
  # Every branch, not just the default one: the mutant runs that prove these
  # checks can actually go red (plan C, task C1 step 4) are pushed branches
  # with no pull request, and a workflow that only listens to `main` and PRs
  # would leave them unobserved.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to the exact version in global.json, which sets
          # rollForward: disable — a runner with only a newer SDK would fail
          # to build at all rather than build with an unpinned toolchain.
          dotnet-version: 8.0.424

      - name: Restore
        run: dotnet restore OathAndCoin.sln

      # TDD §19.1. Runs before the build so that a formatting-only failure is
      # reported in seconds instead of minutes.
      - name: Format
        run: dotnet format OathAndCoin.sln --verify-no-changes --no-restore

      # Guards the risk this task exists for: `dotnet build` only builds the
      # projects listed in the .sln. If OathAndCoin.Game silently falls out
      # of the solution during a merge, the build keeps succeeding on
      # everything else and stays green while the Godot-side code stops
      # being compiled at all. Checked here, right before Build, so a
      # missing project is reported with its own clear message instead of
      # surfacing later as an unexplained gap in build output.
      #
      # The pattern is escaped to the exact file name, not a bare substring:
      # `adapters/OathAndCoin.GameProtocol/OathAndCoin.GameProtocol.csproj`
      # is also in the solution and its path contains "OathAndCoin.Game" as
      # a substring, so an unescaped grep would still match it and stay
      # silent while the real game project was gone.
      - name: Verify game project is in the solution
        shell: bash
        run: |
          dotnet sln OathAndCoin.sln list | grep -q "OathAndCoin\.Game\.csproj" || {
            echo "::error::OathAndCoin.Game is missing from OathAndCoin.sln — the Godot game project has fallen out of the solution, so 'dotnet build' silently stops compiling it. Run 'dotnet sln OathAndCoin.sln add game/OathAndCoin.Game.csproj' to restore it." >&2
            exit 1
          }

      # ADR-008 caps the harness at 1050 code lines. The cap lived only in prose
      # until now, and the number quoted beside it in the record had been
      # produced by a command nobody wrote down — the two disagreed by 80 lines.
      # A ceiling that is not measured by anything is a wish, so it is measured
      # here, by the same script a developer runs locally, and the exact
      # counting rule lives in that script rather than in a sentence.
      #
      # Raising the cap is a decision for the owner, recorded in ADR-008. This
      # step exists to make sure that decision is taken deliberately instead of
      # arrived at one commit at a time.
      - name: Verify the harness stays under its line cap
        shell: bash
        run: ./scripts/code-lines.sh --cap 1050 tools/OathAndCoin.Harness

      # TDD §19.2. TreatWarningsAsErrors (Directory.Build.props) makes any
      # warning a failure here; CI=true also turns on ContinuousIntegrationBuild,
      # which normalizes source paths embedded in the assemblies.
      - name: Build
        run: dotnet build OathAndCoin.sln -c Release --no-restore

      # TDD §19.3-5. The core boundary guard, content schema validation and the
      # determinism properties are all tests, not separate CLI stages: one
      # runner, one report, one place to look when something goes red.
      - name: Test
        run: dotnet test OathAndCoin.sln -c Release --no-build

      # TDD §19.7. The tests above prove determinism inside one process; this
      # proves it across two, which is the claim MVP_PLAN §4.3 actually makes.
      # Two independent processes, same seed, byte-identical canonical
      # artifact.
      #
      # `git diff --no-index` does the comparison because it is the one
      # byte-comparison tool guaranteed to be present and to behave identically
      # on the Linux runner and on a Windows workstation, and it exits non-zero
      # on difference without any shell plumbing. `cmp` would work on the
      # runner and not in a plain Windows shell; the point of the pipeline is
      # that a developer can run the same command that failed.
      - name: Determinism replay
        id: replay
        shell: bash
        run: |
          dotnet run --project tools/OathAndCoin.SimulationRunner -c Release --no-build -- \
            run-scenario \
            --content content --schemas schemas \
            --commands scenarios/gate0.commands.json --seed 424242 \
            --artifact artifacts/gate0-canonical.json \
            --report artifacts/gate0-report.txt

          dotnet run --project tools/OathAndCoin.SimulationRunner -c Release --no-build -- \
            run-scenario \
            --content content --schemas schemas \
            --commands scenarios/gate0.commands.json --seed 424242 \
            --artifact artifacts/gate0-canonical.replay.json \
            --report artifacts/gate0-report.replay.txt

          git diff --no-index --exit-code \
            artifacts/gate0-canonical.json \
            artifacts/gate0-canonical.replay.json

      # Spec §8.1: the evidence a reviewer and the product owner read is
      # produced by the run, never retyped into a pull request description.
      #
      # always(), because a failed replay is exactly when the two artifacts are
      # worth reading — but not when the replay never ran. The three mutant
      # runs of plan C step 4 all failed at Test, which skips the replay, and
      # this step then went red a second time with "no files found": a failure
      # that says nothing about the mutant and pushes the real one further up
      # the log. Guarding on the replay's outcome keeps `if-no-files-found:
      # error` meaningful — it now fires only when the run that was supposed to
      # produce evidence produced none.
      - name: Upload evidence
        if: always() && steps.replay.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: gate0-evidence
          path: artifacts/
          if-no-files-found: error

  # ADR-008 recorded that running the engine in CI was "not tried and did not
  # fail". This job is the measurement that turns that into a fact. It is a
  # job of its own, not extra steps on `build`: everything above proves things
  # about the simulation and costs about a minute, and nothing here is allowed
  # to make that slower or to gate it.
  #
  # What it proves that `build` cannot: the game actually starts under the
  # pinned engine, renders a window, and the screen it renders agrees with the
  # model the harness computed independently — see ADR-008 for the exact list
  # of conditions and, more importantly, for what they do not prove.
  runtime-smoke:
    runs-on: ubuntu-latest

    # Generous against the existing job's 10: a software-rendered engine start
    # is the slowest thing in this repository, and a timeout that fires on a
    # slow-but-healthy runner is a flaky gate, which is worse than no gate.
    timeout-minutes: 20

    env:
      # Pinned by URL, and verified against the checksum the release itself
      # publishes (SHA512-SUMS.txt of 4.7.1-stable). ADR-001 pins the engine
      # version; this pins the bytes. The harness's own verify_engine phase
      # then re-checks the version and records the binary's SHA-256, so a
      # wrong download fails twice over rather than running quietly.
      GODOT_ZIP_URL: >-
        https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
      GODOT_ZIP_SHA512: 0dd41f159a358b3cf23898a8d6aa3b346bd91a574b22991bbd3bc812cd414ad1b1d7701de7124bd9818f0d52b3734a885f0edaeab9cb4b2cd1d5049171e304b8

      # The capture path needs a rendering context, so `--headless` is not an
      # option for the run itself (it is still used for `--import`, which
      # renders nothing). A GitHub runner has no GPU, so the context comes
      # from Mesa's llvmpipe. Forced rather than left to auto-detection: a
      # silent fallback to a stub driver produces a blank frame, and a blank
      # frame is a failed verdict (frame_distinct_colors <= 1) whose cause
      # would be invisible here.
      LIBGL_ALWAYS_SOFTWARE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      # xvfb + xauth give the engine a real X display to open a real window
      # on; the mesa packages give that window a GL 3.3 context via llvmpipe.
      # The rest are the X client libraries the engine binary links against —
      # a missing one is a load-time failure with no frame and no log.
      - name: Install the virtual display and software GL
        shell: bash
        run: |
          started=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils \
            libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1
          echo "install_seconds=$(( $(date +%s) - started ))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download and verify the engine
        shell: bash
        run: |
          started=$(date +%s)
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" "$GODOT_ZIP_URL"
          elapsed=$(( $(date +%s) - started ))

          bytes=$(stat -c %s "$RUNNER_TEMP/godot.zip")
          echo "download_bytes=$bytes download_seconds=$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

          echo "$GODOT_ZIP_SHA512  $RUNNER_TEMP/godot.zip" | sha512sum --check --strict -

          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"

          # Resolved from the archive rather than spelled out a second time:
          # the directory inside the zip and the binary inside it are named by
          # different conventions (…_x86_64/ but ….x86_64), and a hard-coded
          # path that drifts would fail as "no engine" instead of as "the
          # archive changed shape". Exactly one match, or stop.
          shopt -s nullglob
          binaries=("$RUNNER_TEMP"/godot/*/Godot_v*_mono_linux.x86_64)
          if [ "${#binaries[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one engine binary in the archive, found ${#binaries[@]}." >&2
            unzip -l "$RUNNER_TEMP/godot.zip" | head -20 >&2
            exit 1
          fi

          chmod +x "${binaries[0]}"
          echo "GODOT=${binaries[0]}" >> "$GITHUB_ENV"

      # Release, matching the `build` job, and separately from the runs below
      # so the harness's own build time is not counted as a scenario's.
      - name: Build the harness
        shell: bash
        run: |
          dotnet restore OathAndCoin.sln
          dotnet build tools/OathAndCoin.Harness/OathAndCoin.Harness.csproj -c Release --no-restore

      # 1920x1080 rather than 1280x720: the window the run asks for is exactly
      # 1280x720, and a screen of exactly that size leaves no room for a
      # window manager's idea of a usable rect. There is no window manager
      # under Xvfb, so the window gets the size it asked for — the verdict
      # checks that, and a resized window fails it.
      #
      # --timeout 120 rather than the default 60: llvmpipe is several times
      # slower to bring up a context than a real GPU, and the measurement this
      # job exists for is the wall clock, not how close it sails to a limit.
      - name: Runtime smoke — gate0
        id: smoke_gate0
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            dotnet run --project tools/OathAndCoin.Harness -c Release --no-build -- \
            run-smoke --scenario gate0 --godot "$GODOT" --timeout 120

      # always(), because a failed gate0 says nothing about whether the error
      # screen still comes up, and the cost this job is measuring is what both
      # scenarios cost together. Guarded on the first scenario having run at
      # all, so a job that died at the download does not report a second
      # failure that is really the first one again.
      - name: Runtime smoke — content_error
        id: smoke_content_error
        if: always() && steps.smoke_gate0.outcome != 'skipped'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            dotnet run --project tools/OathAndCoin.Harness -c Release --no-build -- \
            run-smoke --scenario content_error --godot "$GODOT" --timeout 120

      # The numbers a reader of this job wants — which engine ran, how long
      # each phase took, the frame's hash and how many colours it held — are
      # already in each run's report.json. Quoted into the log and the job
      # summary so they can be read without downloading the artifact, and so
      # two runs of this workflow can be compared line by line.
      - name: Summarise the runs
        if: always() && steps.smoke_gate0.outcome != 'skipped'
        shell: bash
        run: |
          shopt -s nullglob
          reports=(artifacts/smoke/*/*/latest-attempt.json)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::warning::No run published a report."
            exit 0
          fi

          for report in "${reports[@]}"; do
            jq -r '
              "### \(.scenario) / \(.checkpoint)",
              "",
              "- verdict: \(.verdict.passed)",
              "- reasons: \(.verdict.reasons | if length == 0 then "none" else join(" | ") end)",
              "- engine: \(.engine.version // "n/a") sha256=\(.engine.sha256 // "n/a")",
              "- sdk: \(.sdk_version // "n/a")",
              "- frame: \(.actual.frame.width)x\(.actual.frame.height) \(.actual.frame.byte_length) bytes sha256=\(.actual.frame.sha256)",
              "- distinct colours: \(.actual.terminal_event.frame_distinct_colors // "n/a")",
              "- phases: \([.phases[] | "\(.id)=\(.duration_ms)ms/\(.verdict)"] | join(" "))",
              ""
            ' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Same rule as the evidence upload above: published when there is
      # something to publish, and a failed run is exactly when the frame and
      # the log are worth reading.
      - name: Upload runtime evidence
        if: always() && steps.smoke_gate0.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-evidence
          path: artifacts/smoke/
          if-no-files-found: error
