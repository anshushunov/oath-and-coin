# The TypeScript half of the dual-stack pipeline (ADR-010, Task 5).
#
# It runs beside `dotnet.yml`, not instead of it: until cutover (Task 19) both
# stacks are live, and the migration's whole safety argument is that the old
# gates stay green while the new ones come up. Two workflows rather than two
# jobs in one file, because they have nothing in common — different toolchain,
# different runner needs, and a reader looking at a red X should not have to
# work out which stack it belongs to.
#
# Order is cheapest-first, so a type error is reported in a minute instead of
# waiting behind a browser download.
name: typescript

on:
  # Every branch, matching dotnet.yml and for the same reason: the mutant runs
  # that prove a check can go red are pushed branches with no pull request.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need Windows. The browser build is a first-class
  # target (ADR-010), so its evidence is produced on Linux like the rest.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from the file rather than repeated here. The workspace test
          # asserts .nvmrc agrees with the engines range, so the version this
          # runner uses is the one the repository declares — in one place.
          node-version-file: .nvmrc

      # `corepack enable` puts the pnpm from package.json's `packageManager` on
      # PATH, hash-verified. Deliberately not `corepack pnpm <script>`: under
      # that form a pnpm spawned by a script — or by a tool like
      # electron-builder — resolves to corepack's own known-good release
      # instead of the pinned version and refuses to run.
      - name: Enable the pinned package manager
        run: corepack enable

      # --frozen-lockfile, so a lockfile that disagrees with the manifests
      # fails here rather than being silently updated into whatever the
      # registry serves today (ADR-010 §123).
      - name: Install
        run: pnpm install --frozen-lockfile

      # TDD §19.1 asks for formatting/lint first, and it is also the cheapest
      # thing here — a style slip or a floating promise is reported in seconds
      # instead of behind a browser download.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Three statements of the content rules, held to each other: the Zod
      # contracts, the generated schemas committed beside them, and the
      # hand-written schemas the .NET stack still reads until cutover. Cheap, and
      # it is the only thing standing between "a range was raised in one place"
      # and content that is valid for exactly one of the two stacks.
      - name: Content schemas
        run: pnpm schema:check

      # ADR-010 §63 makes this the single authoritative check on dependency
      # direction and cycles.
      - name: Dependency boundaries
        run: pnpm lint:deps

      - name: Test
        run: pnpm test

      # Playwright's browsers are not in the lockfile — they are binaries the
      # tool downloads — so the version installed here is the one pinned by
      # @playwright/test, and only the browser this suite actually uses.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser evidence
        id: e2e
        run: pnpm test:e2e

      # The numbers of the browser run live in this file and nowhere else — AGENTS.md
      # §11: a number is published by the run that produced it, never retyped into a PR
      # description. It is also the stage that makes the evidence a gate rather than a
      # pile of files: a suite that stopped writing reports fails here, where a bare
      # upload with `if-no-files-found` would still have found last stage's `artifacts/`.
      #
      # This is a new CI check, so AGENTS.md §8 requires a mutant on it, and the journal
      # records which branch reddened it.
      #
      # KEPT AS IT IS, and the decision is written down because Task 18 removed the
      # same shape one job below and review asked whether it belongs here too.
      #
      # It looks identical — a step that fails a second time after an earlier step
      # already failed — and it is not the same thing. The `release-gate` step this
      # was compared with publishes measurements with no threshold, where a missing
      # number on a failed run is the expected state and failing on it added a red
      # that said nothing. This step is the gate on evidence being *produced*: a
      # suite that quietly stopped writing reports has to fail somewhere, and this
      # is the only place that can notice.
      #
      # The residue is real and is named rather than fixed: when `pnpm test:e2e`
      # fails after writing two of the five states, this step also fails, and its
      # message ("produced no evidence for: …") reads as "the suite stopped writing
      # reports" when the truth is "the suite stopped". Making it a notice when
      # `steps.e2e.outcome == 'failure'` and an error when e2e passed would separate
      # the two — that is the shape to take when someone next touches it. Not taken
      # here: it changes what a gate does, and the branch cannot be pushed from this
      # task, so it could not be shown red on CI. An unproven change to a gate is
      # worse than a named limit.
      - name: Summarise the browser evidence
        if: always() && steps.e2e.outcome != 'skipped'
        shell: bash
        run: |
          root=artifacts/browser-evidence
          expected="screen_loading screen_empty screen_error screen_incomplete screen_normal"

          missing=""
          for state in $expected; do
            [ -f "$root/$state/report.json" ] || missing="$missing $state"
            [ -f "$root/$state/screenshot.png" ] || missing="$missing $state/frame"
            [ -f "$root/$state/events.jsonl" ] || missing="$missing $state/events"
          done

          if [ -n "$missing" ]; then
            echo "::error::The browser run produced no evidence for:$missing"
            exit 1
          fi

          {
            echo "### browser evidence"
            echo
            echo "| state | read model | rendered ui | content | viewport | window | reachable | events |"
            echo "|---|---|---|---|---|---|---|---|"
            for state in $expected; do
              jq -r '
                "| \(.screen_state) | \(.read_model_hash[0:16]) | \(.rendered_ui_hash[0:16]) "
                + "| \(.layout.contentWidth)x\(.layout.contentHeight) "
                + "| \(.layout.viewportWidth)x\(.layout.viewportHeight) "
                + "| \(.layout.windowHeight) "
                + "| \(.layout.reachableWidth)x\(.layout.reachableHeight) | \(.events) |"
              ' "$root/$state/report.json"
            done
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The second screen's five states, listed here for the same reason the first five
      # are: a state whose run stops producing evidence has to fail a stage, and the only
      # place that can be noticed is a list of what was expected. Its own step and its own
      # table because the two screens report different things — the slots screen has no
      # corpus behind it, so there is no read-model hash to print, and it reports which of
      # the five shapes the storage put it in instead.
      #
      # Same decision, same residue, same reason as the step above — it is the second
      # of the two, and naming only one of a pair is how a class gets half-fixed.
      - name: Summarise the save-slots evidence
        if: always() && steps.e2e.outcome != 'skipped'
        shell: bash
        run: |
          root=artifacts/browser-evidence/saves
          expected="loading empty error incomplete normal"

          missing=""
          for state in $expected; do
            [ -f "$root/$state/report.json" ] || missing="$missing $state"
            [ -f "$root/$state/screenshot.png" ] || missing="$missing $state/frame"
            [ -f "$root/$state/events.jsonl" ] || missing="$missing $state/events"
          done

          if [ -n "$missing" ]; then
            echo "::error::The save-slots run produced no evidence for:$missing"
            exit 1
          fi

          {
            echo "### save-slots evidence"
            echo
            echo "| state | texts | content | viewport | window | reachable | events |"
            echo "|---|---|---|---|---|---|---|"
            for state in $expected; do
              jq -r '
                "| \(.saves_screen_state) | \(.texts) "
                + "| \(.layout.contentWidth)x\(.layout.contentHeight) "
                + "| \(.layout.viewportWidth)x\(.layout.viewportHeight) "
                + "| \(.layout.windowHeight) "
                + "| \(.layout.reachableWidth)x\(.layout.reachableHeight) | \(.events) |"
              ' "$root/$state/report.json"
            done
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The vitest report of whatever ran here, on its own and under a bare
      # `always()`. It is not folded into the upload below, and that is the whole
      # point of it existing separately.
      #
      # Task 18 put the capture of the unexplained intermittent red into the
      # `release-gate` job and review measured where the red will actually happen:
      # `pnpm test` runs in *this* job too, on every push, and every upload here is
      # gated on `steps.e2e.outcome != 'skipped'`. A red `pnpm test` fails the job
      # before `Install the browser`, so `e2e` never runs, `skipped` is exactly what
      # its outcome is, and both uploads are skipped with it — the failing run's
      # `results.json` goes nowhere. The mechanism was in the job where the flake had
      # not been seen and missing from the one where it was.
      #
      # `if-no-files-found: warn`, unlike the evidence upload below: a job that died
      # in `Install` never reached vitest, and failing it twice for that would be the
      # second-red-that-says-nothing this workflow already carries one note about.
      - name: Upload the vitest report, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-vitest-report
          path: artifacts/vitest/
          if-no-files-found: warn

      - name: Upload browser evidence
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-evidence
          path: artifacts/
          if-no-files-found: error

      # A measurement, published as an artifact, with no threshold attached — and it is
      # here because of AGENTS.md §11, not because of §8. The record's rule is that a
      # number is quoted together with the command that produced it and that the trail
      # is "артефакт CI, а не файл в git": a p50 that exists only in an agent's local
      # console is unverifiable by anyone else, however honestly it was measured. That
      # is what external review found about the numbers in the migration journal §9.1.
      #
      # It is still a step that can fail — a benchmark that no longer runs stops the job
      # — so it carries the mutant AGENTS.md §8 asks of every new stage. What it is not
      # is a gate on latency: Task 18 owns that, and inventing a budget here would dress
      # a number this script chose as a requirement.
      - name: Decision benchmark
        id: bench
        run: pnpm bench:decision

      - name: Upload the decision benchmark
        if: always() && steps.bench.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: decision-benchmark
          path: artifacts/decision-benchmark/
          if-no-files-found: error

  # The release gate: the three commands that have to answer before a branch is
  # merged, in one job, in the order a reader of a red X would want them.
  #
  # It is not a rerun of `checks` above with a shorter name. `checks` reports
  # ten separate stages, which is what a developer watching a push wants; this
  # job runs the single command a developer types locally, so that "green here"
  # and "green on my machine" are the same sentence rather than two lists that
  # have to be compared by eye. A stage that fell out of `pnpm verify` fails
  # here and passes there, which is exactly the disagreement worth catching.
  #
  # **The cost, named rather than left to be discovered.** This job re-runs every
  # stage `checks` already ran, and `dotnet test` on top, on every push — roughly
  # 2.5 minutes of runner beside the 1.5 that `checks` costs, and the .NET half is
  # also run by `dotnet.yml`. That is deliberate and it is not free: the duplication
  # is what buys the disagreement check above ("green here" vs "green on my
  # machine"), and it is the first thing to reconsider if push traffic makes runner
  # time matter. The cheaper shapes both give something up — `needs: checks` makes
  # the gate serial and roughly doubles wall clock, and restricting this job to
  # pull requests leaves the mutant branches AGENTS.md §8 asks for unobserved, which
  # is exactly what the `on:` block at the top of this file exists to prevent.
  #
  # Three steps and not one, because they are three different verdicts:
  # "the TypeScript stack is sound", "nothing unreviewed reaches a player at
  # runtime", "the .NET stack the migration has not cut over from yet is still
  # green". Merging them into one shell line would report all three as the
  # first one that failed.
  #
  # **Why the desktop gate is not here.** `pnpm test:desktop` needs an Electron
  # binary, a Windows host and — measured in Task 18 — the machine's real user
  # data directory for its read-only launch, which makes it a machine-wide
  # singleton: of four concurrent runs on one workstation exactly one passed,
  # the other three died on `electron.launch` with Playwright's generic "Target
  # page, context or browser has been closed". It therefore keeps the job below,
  # on its own runner. The RSS budget was suspected of the same flakiness and
  # measured innocent: twelve runs — five solo, three overlapping pairs, one
  # four-way, one beside a full `pnpm verify` — reported 413.8 to 420.5 MiB
  # against the 500 MiB budget, and concurrency moved that number by under
  # 3 MiB.
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-dotnet@v4
        with:
          # The same pin `dotnet.yml` uses, and for its reason: global.json sets
          # rollForward: disable, so a runner with only a newer SDK fails to
          # build rather than building with an unpinned toolchain.
          dotnet-version: 8.0.424

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Teed into a file, and that is this step's second job.
      #
      # Task 16.3 watched a red appear twice on a cold machine and lose its own
      # message both times; nine warm runs never reproduced it, and AGENTS.md §8
      # forbids silencing it with a timeout while nobody knows what it said.
      # A CI runner is the first place cold runs are real rather than simulated,
      # so the first red here has to survive the job that produced it. The log
      # catches what the json reporter cannot — a worker that exited, a
      # rejection outside any test, and the transform/import timings that were
      # the only thing the two observations had in common.
      #
      # `shell: bash` on purpose: GitHub runs it as `bash -eo pipefail`, so the
      # step still fails when `pnpm verify` does rather than reporting `tee`'s
      # exit code.
      - name: Release gate — pnpm verify
        id: verify
        shell: bash
        run: |
          mkdir -p artifacts/release-gate
          pnpm verify 2>&1 | tee artifacts/release-gate/verify.log

      - name: Release gate — runtime dependency audit
        id: audit
        shell: bash
        run: |
          mkdir -p artifacts/release-gate
          node scripts/audit-runtime-dependencies.mjs 2>&1 | tee artifacts/release-gate/audit.log

      # The other stack, still live until cutover (Task 19). Not `--no-build`:
      # this job never ran `dotnet build`, and a `-c Release` test run builds
      # what it needs. It is deliberately the last of the three — it is the
      # slowest and the least likely to be what a TypeScript branch broke.
      - name: Release gate — dotnet test
        id: dotnet
        shell: bash
        run: |
          mkdir -p artifacts/release-gate
          dotnet test OathAndCoin.sln -c Release 2>&1 | tee artifacts/release-gate/dotnet.log

      # The two numbers this job publishes and gates on neither. The bundle is
      # already on disk — `pnpm verify` ends with a production build — so only
      # the decision benchmark has to be run.
      - name: Measure the decision path
        if: always() && steps.verify.outcome == 'success'
        run: pnpm bench:decision

      # `always()`, with no `if-no-files-found: error`: the whole point is the
      # run that failed, and a job that died in `Install` has nothing to publish
      # and should not be failed twice for it.
      - name: Upload the release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            artifacts/release-gate/
            artifacts/vitest/
            artifacts/runtime-audit/
            artifacts/decision-benchmark/
          if-no-files-found: warn

      # Measurements, published with no threshold attached, and the absence of a
      # threshold is the decision rather than an omission. A bundle size or a
      # p50 invented here would either never go red or go red on runner noise,
      # and a gate nobody trusts is worse than a number nobody gated. The
      # decision benchmark in `checks` above carries the same reservation for
      # the same reason; when the battle scene arrives and needs a latency
      # budget, it will come with a decision record rather than with a guess.
      #
      # Every measurement is guarded on its own file existing, and that is not
      # defensive habit — it was measured. The first version reached straight
      # for `apps/web/dist/assets`, which only exists once `pnpm verify` has got
      # as far as `pnpm build`; on the two mutant runs that failed earlier than
      # that, `find` exited non-zero inside a command substitution and
      # `bash -eo pipefail` failed this step too. The job then reported two reds
      # where one thing was wrong, and the second one said nothing about the
      # first — which is the exact failure `dotnet.yml` records against its own
      # evidence upload. A missing measurement on a failed run is the expected
      # state, not a second defect.
      - name: Summarise what was measured, without gating on it
        if: always() && steps.verify.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "### release gate"
            echo
            echo "| measurement | value |"
            echo "|---|---|"

            if [ -d apps/web/dist/assets ]; then
              bundle=$(find apps/web/dist/assets -name '*.js' -printf '%s\n' |
                awk '{ total += $1 } END { print total + 0 }')
              echo "| browser bundle, js bytes | $bundle |"
            fi

            report=artifacts/decision-benchmark/report.json
            if [ -f "$report" ]; then
              echo "| decide, p50 ms | $(jq -r '.decide.p50_ms' "$report") |"
              echo "| proposeContractToHero, p50 ms | $(jq -r '.propose_contract_to_hero.p50_ms' "$report") |"
            fi

            if [ -f artifacts/runtime-audit/report.json ]; then
              echo "| runtime packages reachable | $(jq -r '.closure | length' artifacts/runtime-audit/report.json) |"
            fi

            # The LAST vitest run of the chain, not the sum of both. `pnpm verify`
            # runs `test` and then `test:scenario`, and they write one file: on a
            # green run the second overwrites the first, and on a red one the file
            # is the failing run's, which is the case this artifact exists for.
            # Labelled rather than summed, because a total nobody can trace back to
            # a command is the kind of number AGENTS.md §11 refuses.
            if [ -f artifacts/vitest/results.json ]; then
              echo "| vitest, last run of the chain, passed/total | $(jq -r '"\(.numPassedTests)/\(.numTotalTests)"' artifacts/vitest/results.json) |"
            fi

            echo
            echo "No threshold is attached to any of these. See the step's comment."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The Task 4 gate, on the only OS it means anything on. Its own job because
  # a Windows runner is several times slower to provision than the Linux one
  # above, and nothing in `checks` should wait behind it.
  #
  # ADR-011 is what makes this runnable in CI at all: with the storefront SDK
  # out of scope the gate needs no Steam client, no account and no App ID, so
  # its verdict is reproducible by anyone rather than by whoever was logged in.
  packaged-desktop:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package the desktop host
        run: pnpm package:desktop

      - name: Desktop gate
        id: gate
        run: pnpm test:desktop

      # The gate's numbers — installed size, RSS per process, what the page
      # could reach — live in this file and nowhere else (AGENTS.md §11: a
      # number is published by the run that produced it, never retyped).
      - name: Summarise the gate
        if: always() && steps.gate.outcome != 'skipped'
        shell: bash
        run: |
          report=artifacts/electron-spike/gate-report.json
          if [ ! -f "$report" ]; then
            echo "::warning::The gate produced no report."
            exit 0
          fi
          jq -r '
            "### packaged desktop gate",
            "",
            "- installed: \(.packagedBytes) bytes in \(.packagedFiles) files",
            "- rss: \(.rssBytes) bytes",
            "- processes: \([.processes[] | "\(.type)/sandboxed=\(.sandboxed)/\(.workingSetBytes)"] | join(" "))",
            "- page reached: \(.pageExposure.desktopApiKeys | join(",")) (ipcRenderer=\(.pageExposure.ipcRendererReachable) require=\(.pageExposure.requireReachable))",
            ""
          ' "$report" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the gate evidence
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-gate-evidence
          # The packaged application itself is 300 MB and is not published;
          # the report and any failure traces are.
          path: |
            artifacts/electron-spike/gate-report.json
            artifacts/desktop-report/
            artifacts/desktop-results/
          if-no-files-found: error
