# Packaging for the Task 4 gate (ADR-010, narrowed by ADR-011).
#
# `--dir` is what the gate runs: an unpacked application directory, which is
# the installed footprint the 300 MB budget talks about. An NSIS installer is
# a wrapper around exactly these bytes and belongs to Task 17, together with
# signing — building one here would add minutes and a code-signing question to
# a gate that exists to answer "does the packaged host start at all".
appId: com.oathandcoin.desktop
productName: Oath and Coin

directories:
  output: ../../artifacts/electron-spike

# Only the built output. Both entries are bundled by Vite, so nothing else is
# needed at runtime — but listing `dist/**` alone is not enough to say that:
# electron-builder adds production `dependencies` to its own default patterns,
# and after `zod` moved from devDependencies to dependencies the package
# silently grew by 612 files and 4 224 422 bytes of a library that was already
# inside `main.cjs`. The exclusion is what makes the intent enforceable.
#
# If something ever stops being bundled, this turns into a startup failure
# rather than a silent fallback — and the packaged gate is what catches it, the
# same way it caught "Cannot find module 'zod'" when Vite externalised it.
files:
  - dist/**
  - '!node_modules/**'

# The renderer is carried as a resource rather than compiled into the host,
# which is the whole point of ADR-010's split: the file loaded in the packaged
# app is byte-identical to the one Playwright drives in a plain browser.
extraResources:
  - from: ../web/dist
    to: web

win:
  target:
    - dir

# Chromium ships every locale it knows — 55 files, 47 MB — and this game has
# one language plus English. `content/locale` holds `ru.json` and nothing else,
# so the rest are locales no string in this repository can select.
#
# Done with a hook rather than with electron-builder's own `electronLanguages`,
# which was tried first and is silently a no-op on Windows: the packaged
# directory came out at 350 MB with all 55 .pak files still in it. A setting
# that reads as an instruction and does nothing is worse than none, so it is
# gone and the removal is something the hook prints and the gate measures.
afterPack: build/after-pack.cjs

# The gate measures size, so nothing may quietly inflate it.
compression: normal
asar: true
