# The workspace ADR-010 fixes. Only the members that already hold a real
# artifact are listed: `apps/desktop` arrives with Task 4, and
# `packages/simulation`, `packages/content`, `packages/presentation`,
# `packages/application` and `tools/scenario-runner` join this list in the task
# that writes their first file (Tasks 6-12). That is what TDD §20 asks for —
# "не нужно создавать пустые каталоги до появления их первого артефакта". A
# member listed here with nothing in it would still be typechecked, tested and
# linted by every gate, all of them green on nothing, which reads as coverage
# of a package that does not exist yet.
packages:
  - apps/web
  - tests/architecture
  - tests/e2e

# pnpm 10 and later refuse to run a dependency's install scripts unless it is
# named here. ADR-010 §123 asks for exactly that allowlist: npm widens the
# supply-chain surface, and an install script is arbitrary code executing on
# every machine that clones this repository. Each entry below is a package
# whose build step this repository actually needs, and nothing is added to it
# because an install printed a warning.
onlyBuiltDependencies:
  # Native Go binary behind Vite's transform pipeline. Blocked, esbuild
  # installs without its binary and Vite cannot start at all.
  - esbuild
