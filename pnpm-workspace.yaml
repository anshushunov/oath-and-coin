# The workspace ADR-010 fixes. Only the members that already hold a real
# artifact are listed: `packages/application` joins this list in the task that
# writes its first file (Task 12); `packages/presentation` and the `tests/locale`
# member that checks its keys against the shipped catalogue joined in Task 11,
# and `tools/scenario-runner` in Task 10. That is what TDD §20 asks for —
# "не нужно создавать пустые каталоги до появления их первого артефакта". A member listed here with nothing
# in it would still be typechecked, tested and linted by every gate, all of them
# green on nothing, which reads as coverage of a package that does not exist yet.
#
# `packages/simulation` arrives in Task 6 rather than in Task 7 as the segment 2
# hand-off expected. Identity is Task 6's own deliverable, and the direction
# ADR-010 fixes (simulation ← content) puts `ContentId` in the innermost package:
# both state and content key collections by it, so putting it in `content` would
# have made the simulation import the content layer.
packages:
  - apps/web
  - apps/desktop
  - packages/simulation
  - packages/content
  - packages/presentation
  - tests/architecture
  - tests/locale
  - tests/desktop
  - tests/e2e
  - tests/oracle
  - tools/scenario-runner

# pnpm refuses to run a dependency's install script unless it is answered for
# here. ADR-010 §123 asks for exactly that allowlist: npm widens the
# supply-chain surface, and an install script is arbitrary code executing on
# every machine that clones this repository.
#
# Every entry is a decision, including the denials — pnpm re-asks about an
# unanswered package on every install, and a prompt that appears often enough
# gets approved by whoever is in a hurry.
allowBuilds:
  # Native Go binary behind Vite's transform pipeline. Denied, esbuild installs
  # without its binary and Vite cannot start at all.
  esbuild: true
  # Downloads the pinned Electron binary for the host platform. Denied, the
  # package installs as an empty shell — `node_modules/electron/dist` never
  # appears — and both `package:desktop` and `test:desktop` fail where they
  # would spawn it.
  electron: true
  # Builds the Squirrel installer. This repository packages with `--dir` only;
  # the installer and its signing are Task 17's.
  electron-winstaller: false
